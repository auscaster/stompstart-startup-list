name: LUCI
tagline: Local screen and meeting memory for AI agents
description: >-
  A desktop app for Windows and Apple Silicon Macs that records screen activity
  and meetings, indexes that context locally, and makes it searchable. Selected
  context can be retrieved by AI agents such as Codex, Claude Code and Cursor
  while the underlying recordings and memory remain on the user's computer.
problem: AI agents miss work context that lives outside connected apps and the current conversation.
audience:
  - People who use desktop AI coding agents
  - Knowledge workers who want searchable local screen and meeting history
