name: HyperProbe
tagline: Read-only probes that let coding agents read live variable state in a running production service
description: >-
  HyperProbe is an on-call agent for backend engineering teams. An SDK for
  Node.js, TypeScript, Java, Kotlin, Python and Ruby services lets a coding
  agent place a read-only probe on a chosen line of a service that is already
  running, so the values held at that line are captured from real traffic
  rather than inferred from logs. The company states that no redeploy is
  needed, that the probe fires asynchronously so the running service never
  pauses, that a probe adds under one percent overhead at 3,000 requests per
  second, that personal data is redacted at the agent before capture, and that
  every placement is written to an audit log. Probes can be driven from an MCP
  server for Cursor, Claude Code, Codex and opencode, or from a VS Code
  extension, and the service can be run inside a private VPC or self-hosted.
  The free plan covers one service with unlimited probes and seven days of
  capture history. The paid plan is listed at $99 per running service per month
  with a three service minimum, or $79 per service billed annually, and raises
  capture history to thirty days.
problem: >-
  When a production incident starts, the value that would explain it is often
  absent from the logs, so an engineer adds a log line and redeploys before
  being able to see it. The company frames this as a loop that costs hours on
  an incident whose fix takes minutes, and argues that an agent asked to
  diagnose the failure can only guess from the data that was already recorded.
audience:
  - Backend teams that carry a production on-call rota
  - Engineers debugging services written largely by coding agents
