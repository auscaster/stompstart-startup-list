name: Whiteboard
tagline: A visual workspace for reviewing software with coding agents
description: >-
  Whiteboard is a desktop editor for developers who want to inspect and discuss
  agent-written software. Its canvas connects diagrams and design notes to source
  code, while a structured diff view helps readers examine changes. Developers can
  connect an existing coding agent and keep its reasoning alongside the review.
  The desktop application is published as open-source software under the MIT license.
problem: Large agent-written changes can be difficult to understand through a line-by-line diff alone.
audience:
  - Software developers reviewing coding-agent output
  - Engineering teams discussing architecture changes
