name: Rhubarb
tagline: Build and publish interactive data visualizations with editable code
description: >-
  Rhubarb combines data connections, SQL transformations and JavaScript chart
  development in a hosted workspace. An AI assistant helps users revise the
  code, while publishing, access controls and scheduled refreshes keep the
  resulting visualizations available beyond the initial editing session.
problem: Custom interactive charts need data preparation, hosting and ongoing updates as well as visualization code.
audience:
  - Data analysts
  - Research and communications teams
