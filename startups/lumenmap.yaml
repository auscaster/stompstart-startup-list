name: LumenMap
tagline: Stellar network activity dashboard with daily volume, active wallets, top dApps, and treemap analytics
description: >-
  LumenMap is a Stellar network analytics dashboard. It tracks daily payment
  volume, active wallet counts, top decentralized applications, and a treemap
  breakdown of on-chain activity so operators can see where the network's
  actual usage concentrates. The dashboard updates from public Stellar
  horizon data and surfaces patterns that raw API queries miss.
problem: >-
  Stellar activity is spread across horizon, soroban-rpc, and per-app
  indexes. There is no single public view that shows daily volume, active
  wallets, and per-dApp concentration in one place.
audience:
  - Stellar dApp operators
  - On-chain analysts
  - Network explorers
