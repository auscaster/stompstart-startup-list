name: copperhead
tagline: An AI agent that edits circuit boards in your own repository
description: >-
  An open source command line agent for hardware design. Given a plain
  English change request or a written brief, it edits KiCad schematics and
  boards inside the git repository you already use, carries each change into
  the pinout, bill of materials and subsystem documents that depend on it, and
  runs the electrical and design rule checks until they pass. A run can start
  from an existing design or from a brief that walks through specification,
  architecture, part selection, a draft layout and gerbers. The CLI is free
  under Apache-2.0 and runs locally; a hosted tier adds a web viewer, private
  repositories and team governance for a monthly price per seat.
problem: Board work stays spread across schematics, part lists and documents that drift apart between revisions, and drift ships to fabrication.
audience:
  - Hardware engineers
  - Electronics hobbyists with KiCad projects
  - Hardware teams at small companies
