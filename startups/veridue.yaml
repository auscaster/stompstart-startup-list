name: Veridue
tagline: Due diligence and deal workflows for energy infrastructure
description: >-
  Veridue provides a shared platform for teams evaluating or financing renewable
  energy and data centre projects. It combines deal screening, document review
  and data-room organisation. Investors and developers can request a demo from
  the company rather than installing a separate tool for each stage.
