name: Harmony
tagline: A service desk for IT and HR teams that runs inside Slack and Microsoft Teams
description: >-
  Harmony is an AI-native service platform for internal support teams.
  Employees raise requests in Slack or Microsoft Teams, where Harmony's
  agents answer questions, carry out routine work such as password resets
  and access requests, and open tracked tickets when a person needs to step
  in. The platform also keeps an inventory of devices, applications and
  licences, and builds a knowledge base from resolved requests over time.
  The company came out of stealth in July 2026 with a $34M seed round led
  by Lightspeed Venture Partners.
problem: Internal support teams spend much of their time on repetitive requests, password resets, access changes and equipment questions, that arrive scattered across chat, email and ticket queues, while employees wait for answers to simple questions.
audience:
  - IT support and service desk teams
  - HR and people teams handling employee requests
  - Companies replacing a legacy ITSM tool
