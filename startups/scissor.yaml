name: Scissor
tagline: A free vector and pixel graphics editor that runs in your browser
description: >-
  A design editor that runs entirely in the browser on WebAssembly. Artwork is
  created, edited and saved on the user's own device, with no install, no
  account and no upload. It covers pen, curvature and shape tools, Bézier path
  editing, type with OpenType features and a glyphs panel, layers, masks and
  clipping, gradients and pattern fills, live non-destructive effects, raster
  tracing into editable vectors and pixel layers. It opens SVG, PDF, EPS, .ai
  and PSD, exports SVG, PDF, PNG, JPEG and WebP, works offline, and can be
  installed as an app. A user manual documents the tools, menus, formats and
  keyboard shortcuts.
problem: >-
  Professional vector editors are subscription products; a browser editor with
  no install and no account lowers the entry bar for occasional design work.
audience:
  - Designers
  - Developers who edit vector artwork
