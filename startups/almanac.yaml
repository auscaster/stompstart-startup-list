name: Almanac
tagline: An AI workspace that connects tasks, conversations and a personal wiki
description: >-
  Almanac brings tasks, projects and conversations into a Mac workspace.
  Connected accounts supply context for a wiki that users can inspect and correct.
  The assistant prepares drafts and follow-ups alongside the relevant task.
  Setup currently requires a separate ChatGPT subscription. The workspace offers
  a seven-day trial with a payment card, followed by a monthly subscription.
problem: Keeping project context and follow-ups consistent across separate work tools.
audience:
  - People managing projects across multiple accounts and conversations
