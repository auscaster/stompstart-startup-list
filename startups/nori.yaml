name: Nori Robotics
tagline: A $1,688 two-armed home robot assembled in San Francisco
description: >-
  Nori Robotics makes the Nori A3, a two-armed robot on a wheeled base for
  everyday household tasks such as folding clothes, loading a dishwasher and
  fetching items. Each arm moves with 7+1 degrees of freedom and lifts up to
  1.5 kg. A lidar with 12 m of range and four 720p RGB cameras handle
  navigation, and a speaker and microphone take spoken commands. The battery
  lasts six to eight hours. Owners train and operate the robot with the Nori
  Lab laptop app, and a skills marketplace lets them share the behaviors they
  teach it. The company assembles the A3 in San Francisco and sells it at
  $1,688 full price with no deposit, shipping from Fall 2026.
problem: >-
  General-purpose robots have cost $20,000 or more, which keeps them in labs
  and pilot programs instead of homes. Household work today is spread across
  single-task appliances that each do one job.
audience:
  - Households that want help with routine chores
  - Small businesses that need affordable mobile manipulation
