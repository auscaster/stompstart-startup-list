launch:
  title: Nori opens orders for the A3, its $1,688 two-armed home robot
  summary: >-
    The San Francisco company began taking orders at full price with no
    deposit for the Nori A3, a two-armed wheeled robot for household tasks,
    with shipping planned from Fall 2026. Forbes reported the launch on
    August 18, 2026, and wider news coverage and the company's own launch
    post followed on August 20. In that post the company said it had already
    deployed its first robot and passed $440,000 in sales.
