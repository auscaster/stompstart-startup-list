name: Agent FM
tagline: A desktop assistant for work across apps and coding agents
description: >-
  Agent FM is a desktop AI assistant that works across files, browser tabs,
  email and other apps. Users describe a task in a chat and review the result
  before actions such as sending a message or changing a record. Its public
  launch introduced a shared chat with live text and audio updates for
  monitoring and directing multiple coding agents.
problem: Routine work and agent progress are scattered across separate apps and sessions.
audience:
  - Founders and operations teams
  - Product teams and software engineers
