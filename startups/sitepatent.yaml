  pricing_url: https://sitepatent.com/pricing
highlights:
  - title: Human review
    detail: Each submitted website is checked by a person before it is listed.
  - title: Free or paid listing
    detail: The free listing waits at least seven days and is marked unverified; one-time paid plans start at $19 and publish at once.
  - title: Data for AI agents
    detail: Listings are available to AI assistants through an MCP endpoint.
