name: SitePatent
tagline: A reviewed directory of newly launched startups and online products
description: >-
  SitePatent lists startups, software tools and other online products that
  have recently gone live. Makers submit their website, a person checks it,
  and each approved product gets a lasting page, sorted into categories, that
  links back to the product. Visitors can browse by category or look at what
  is trending. A free listing is shown as unverified and waits at least seven
  days before it goes live; paid plans publish right away. The site also
  offers its product data to AI agents through an MCP server.
problem: New products are hard to find right after launch, and makers need a place where visitors can discover them.
audience:
  - Startup founders and indie makers
  - People looking for newly launched tools
website: https://sitepatent.com/
access:
