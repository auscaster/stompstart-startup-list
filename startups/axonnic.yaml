name: Axonnic
tagline: Wearable forearm EMG sleeves that capture finger movement and force for robot training
description: >-
  Axonnic builds a 64-channel surface electromyography forearm sleeve and
  decoding software that record individual finger joint angles and fingertip
  force while leaving a worker's hands bare. Synchronizing muscle signals with
  hand-pose data lets robotics teams collect manipulation training datasets for
  tasks such as sewing, fine assembly and tool use, even when cameras lose
  sight of the hand. The company has published held-out benchmarks against
  Apple Vision Pro hand tracking and Meta's EMG dataset, runs paid industrial
  pilots, and accepts refundable preorders for Gen 2 sleeves with free SDK
  access.
problem: >-
  Camera-based hand tracking loses sight of fingers when objects block the view
  and misses the grip force and muscle effort required for skilled manual work.
audience:
  - Robotics teams training dexterous manipulation models
  - Manufacturers automating skilled manual assembly and sewing tasks
