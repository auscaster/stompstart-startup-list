name: Cardify
tagline: Turn Markdown notes into finished knowledge cards
description: >-
  Cardify keeps a Markdown note as the source and renders it as a shareable
  card. The editor sits beside a live preview, so headings, lists, quotes and
  code blocks appear as they will on the card. More than thirty themes change
  the layout, not only the colours, and preset sizes cover square posts, story
  formats and A4. Cards export as PNG, SVG or PDF, one at a time or in a batch
  from a single long note, and a share link keeps the text editable instead of
  freezing it as an image.
problem: A note worth sharing has to be rebuilt by hand in a design tool before it can be posted.
audience:
  - People who write in Markdown and publish to social platforms
  - Teachers and students making study cards
