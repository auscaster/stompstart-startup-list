name: HN.watch
tagline: The Hacker News front page with a video explainer for every story
description: >-
  A news reader that shows the Hacker News front page with a short video
  explainer attached to every story. Each card carries the story's points,
  submitter, comment count and age as on Hacker News, and clicking a title
  opens a player with the explainer video instead of jumping straight to the
  article. A sync badge on the header shows when the list was last refreshed.
  The site is free to read and needs no account.
problem: >-
  Hacker News stories are often dense threads where the context is spread
  across the article and hundreds of comments; a short video summary of each
  story lowers the cost of scanning the front page.
audience:
  - Hacker News readers
  - Developers who skim tech news
