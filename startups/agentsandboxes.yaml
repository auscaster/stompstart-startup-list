name: AgentSandboxes
tagline: A neutral index of cloud sandboxes for AI agents.
description: >-
  AgentSandboxes is a directory of cloud sandbox providers for AI agents.
  A listing records the isolation model, cold start, persistence, GPU
  support, price and free tier each vendor publishes in its own docs, and
  every fact links back to the page it came from. Visitors can browse by
  category, compare providers side by side, or read the same records
  through a free REST API and an MCP endpoint that need no key.
problem: Picking a sandbox for an AI agent means reading every vendor's docs to compare isolation, startup speed and price.
audience:
  - Developers building AI agents
  - Teams comparing sandbox providers
website: https://agentsandboxes.fyi/
