# Hemory — always-on conversation memory for AI agents
name: Hemory
tagline: Always-on listening that wires real conversation memory into your AI agents
description: >-
  Hemory listens on the phone or Apple Watch you already own and turns everyday
  conversations into private, searchable memory. Moments are split and labelled
  automatically, then exposed to Claude, Codex, Cursor and other MCP clients
  through a search_memory tool so agents can answer from what you actually said
  and heard. Audio is processed as a stream with zero cloud audio retention;
  raw audio stays on the listening device. Plans range from a free trial to
  unlimited Max listening, with voice-activity detection counting only spoken time.
problem: >-
  Meeting notes and ad-hoc recordings still leave people stitching context across
  days by hand, and AI tools forget what was said unless someone pasted a transcript.
audience:
  - Knowledge workers who live in meetings
  - Builders who want agents grounded in real conversations
