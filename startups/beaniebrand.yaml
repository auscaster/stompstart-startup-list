name: beaniebrand
tagline: An AI generator that turns a company description into a logo and a matching mascot
description: >-
  beaniebrand draws a logo and an animated mascot from a short written
  description of a company. It returns four character ideas, each as a flat
  logo and a 3D mascot, and the user asks for changes in plain words until one
  fits. The chosen character arrives as a kit: SVG and PNG logo files, favicons
  and app icons, a social share image, an animated mascot, a React component,
  and an AGENTS.md file that a coding agent follows to install the mascot.
  Drawing is free for the first twelve characters and the complete kit is
  bought once.
problem: >-
  A small team wants a logo with a personality instead of another abstract
  mark, and wants that character to appear in the product, on store listings
  and in social profiles without briefing a designer for each of them.
audience:
  - Indie founders and small product teams
  - Developers who build with coding agents
