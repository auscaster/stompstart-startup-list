name: Starlie
tagline: A fast, native Jira client for Mac
description: >-
  Starlie is a native macOS app for people who live in Jira and want it to feel
  quick. It connects to Jira Cloud and self-hosted Jira Server, then gives you
  fast search, sprint boards and inline issue editing without the browser tab.
  Install from the Mac App Store, connect a Jira site, and setup takes about
  five minutes.
problem: >-
  The browser is the slowest part of Jira. Every search, board view and issue
  edit round-trips through a web client that was not designed for daily use on
  a desktop, and the alternatives are heavy IDE plugins.
audience:
  - Jira users on Mac who work in sprint boards and issues daily
  - Engineering and project teams that run Jira Cloud or Server
