name: Pulse Local
tagline: A budgeting app whose AI models run on your machine
description: >-
  Pulse Local is a budgeting app for Mac (Apple Silicon beta) that answers
  questions about your spending with small AI models running locally on your
  machine. Local mode needs no account. You import a CSV from any bank, in any
  currency, and the app keeps the ledger and your questions on the machine: it
  sends no analytics, crash logs or model calls to anyone else. A tuned Qwen3
  0.6B model reads a question into a structured query, then code, not the model,
  does the money math against your ledger, and a second checker model
  double-reads each money answer; when the two readings disagree the app says
  it is not sure instead of guessing. It covers plans and targets, rules,
  rollover, splits, cash flow and forecast, and the tuned model weights are
  published on Hugging Face.
problem: >-
  Most budgeting apps keep your ledger on their servers, or send your questions
  to a hosted model. "Local" usually means your data stays, not your questions.
  Pulse Local keeps both the ledger and the questions on your machine, with no
  account and no analytics.
audience:
  - Privacy-focused personal finance users
  - Mac users who want a local-first budgeting app
