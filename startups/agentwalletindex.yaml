name: Agent Wallet Index
tagline: Wallets and rails that let AI agents spend money safely.
description: >-
  Agent Wallet Index is a directory of agent wallets, payment protocols,
  card rails, payments platforms and key-management layers for AI agents.
  Each row restates facts from the vendor's public docs or the protocol
  spec, with the source URL on the row. Visitors can browse by category,
  compare by rail, chain, custody or protocol, or read the same records
  through a free REST API and an MCP endpoint that need no key.
problem: Picking a wallet or payment rail for an AI agent means comparing custody, fees, protocols and spend controls across scattered vendor docs.
audience:
  - Developers building AI agents that pay for things
  - Teams comparing agent payment infrastructure
website: https://agentwalletindex.fyi/
