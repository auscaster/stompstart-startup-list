name: KiwiDesk
tagline: Tiling that feels like it shipped with macOS
description: >-
  KiwiDesk is a tiling window manager for macOS. It arranges open windows into
  one of seven layouts the moment it is installed, with no configuration file
  required, while keeping the native macOS Desktops intact. Everyday setup is a
  native Settings app with sliders and pickers; keyboard users get hotkeys and
  Vim-style layers, and power users get Lua scripting, per-space rules, and a
  CLI. It runs on Apple Silicon Macs with macOS 14 or later, asks only for the
  Accessibility permission (no SIP changes, no input monitoring, no account,
  no analytics), and is free for personal use with its source published under
  BSL 1.1.
problem: >-
  Tiling window managers on macOS usually demand terminal configuration files,
  and the most powerful one requires disabling System Integrity Protection,
  which keeps most Mac users from ever trying one.
audience:
  - macOS users who want their windows organized
  - Developers and power users who want tiling without terminal configs
