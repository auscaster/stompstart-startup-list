highlights:
  - title: Flows mapped from one command
    detail: >-
      The map command opens the app, or reads its code, and writes the screens
      and journeys a careful tester would cover as flows to run.
  - title: Checks on pull requests
    detail: >-
      Each pull request runs the same flows on its preview and on production,
      with one comment that lists failures by flow and by device.
  - title: Production monitors
    detail: >-
      The same flows repeat against production on a schedule and alert a Slack
      channel when one stops working.
