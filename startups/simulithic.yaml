name: Simulithic
tagline: AI agents that act as users and test web and mobile apps on every pull request
description: >-
  Simulithic sends AI agents through a product the way its users would move
  through it. A single command explores the app, or reads its repository, and
  turns what it finds into a list of user flows, so nobody has to write test
  scripts by hand. The agents then run those flows in real browsers and on real
  phones, across operating systems, screen sizes and network speeds. Teams use
  it in three places: from the terminal, where a coding agent such as Claude
  Code or Codex can run it before opening a pull request; as the end-to-end
  step in CI, where it compares a pull request's preview build with production
  and leaves one comment listing what broke; and as a scheduled monitor on
  production that posts to Slack when a flow stops working. The company is in
  Y Combinator's Fall 2026 batch and is based in San Francisco.
problem: >-
  Coding agents now produce changes faster than teams can check them, while
  hand-written end-to-end tests take time to write and break whenever the
  interface changes.
audience:
  - Software teams that ship changes every day
  - Engineering teams that use coding agents
  - QA and product teams that check user flows before release
