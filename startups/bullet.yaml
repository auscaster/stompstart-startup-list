name: Bullet
tagline: A coding agent with automatic model routing and targeted code search
description: >-
  Bullet is a coding agent available as a desktop application and a command-line
  tool. It chooses models for different tasks, searches relevant parts of a
  repository, and runs independent tool calls in parallel. Developers can use it
  to work on an existing codebase through a conversational interface.
website: https://www.codewithbullet.com/
access:
