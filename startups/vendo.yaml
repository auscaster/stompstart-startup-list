name: Vendo
tagline: An open-source layer that lets users build features inside your product
description: >-
  Vendo embeds an agentic customization layer into software products. End users can
  create dashboards, micro-apps, and automations on top of the host product's API
  and design system, while generated code runs inside sandboxes and the host keeps
  its existing permission boundaries.
problem: >-
  Product teams accumulate customer-specific feature requests that are difficult to
  prioritize and expensive to implement as one-off product work.
audience:
  - SaaS product teams
  - Developers embedding agents into existing products
