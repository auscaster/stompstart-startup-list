name: Versine
tagline: Send and receive money through your AI assistant, with your approval
description: >-
  Versine connects an AI assistant to a wallet, so a chat message can start a
  payment. The user approves each transfer with a passkey in the iPhone or
  Android app, or sets standing rules for trusted contacts. Money moves as
  USDC from a wallet the user owns, and people without an account receive a
  link to cash out to a bank. Sending money is free; only instant withdrawals
  to a bank carry a fee passed through at cost.
problem: >-
  Paying someone back still means opening a separate app and typing the
  details by hand, even when an AI assistant already knows who is owed and
  how much.
audience:
  - People who use AI assistants every day
  - US residents who split bills with friends and roommates
