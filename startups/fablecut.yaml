name: FableCut
tagline: Zero-dependency browser video editor that AI agents can drive
description: >-
  FableCut is a zero-dependency browser-based video editor with a timeline
  supporting four video and four audio tracks, per-track and master audio
  meters, a preview monitor, and an inspector for clip properties. It runs
  entirely in the browser with no server, no dependencies, and an API that
  AI agents can call to edit video programmatically.
problem: >-
  Browser-based video editors are heavy, dependency-laden, and opaque to
  automation. FableCut ships zero dependencies and an agent-callable API so
  an AI can drive the full edit pipeline without a human in the loop.
