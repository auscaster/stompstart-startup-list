name: Chromie
tagline: A workspace for researching and pursuing government contracts
description: >-
  Chromie brings company records, contract opportunities, solicitation analysis,
  and pursuit tracking into one workspace. Government contracting teams can
  compare opportunities with their capabilities, review bid requirements, and
  prepare proposals using information retained from previous pursuits.
problem: >-
  Contract research, bid qualification, and proposal preparation depend on
  information spread across portals, documents, and spreadsheets.
audience:
  - Government contractors
  - Business development and capture teams
