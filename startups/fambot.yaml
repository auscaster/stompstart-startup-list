name: Fambot
tagline: Daily family plans from school messages and calendars
description: >-
  Fambot brings family-related email, calendar updates and group messages into
  a shared daily plan. Parents and caregivers can review upcoming dates and
  tasks, then ask questions by text or in the app. It is available on the web,
  iPhone and Android, and is free during beta.
problem: School deadlines and activity changes are scattered across inboxes, calendars and group chats.
audience:
  - Parents and caregivers coordinating school and family activities
