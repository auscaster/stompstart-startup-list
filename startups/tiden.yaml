name: Tiden
tagline: Intent verification for coding agents. Checks that your AI agents built what you actually asked for.
description: >-
  Tiden is a continuous verification system for agentic coding teams. It sits
  beside your coding agents (Claude Code, Cursor, Codex, Copilot) and verifies
  that what they built is what you actually asked for. Tiden captures your
  intent as versioned requirements that branch and merge like code, picks the
  relevant tests for each change, runs them in your environment before anything
  merges, and traces production errors back to the release and the prompt
  behind it. The verdict comes from real tests, not a model grading the diff.
problem: >-
  Coding agents write code in minutes, but delivery is still slow. PRs stall
  because nobody is sure what else a change touches. CI catches regressions
  late. Reviewers spot invented code. The tests agree with the code by
  construction because the same agent wrote both, so they pass even when the
  output is not what was intended.
audience:
  - Engineering teams shipping agent-written code every day
  - QA and platform engineers building agent pipelines
