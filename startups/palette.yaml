name: Palette
tagline: A web studio for generating and editing images and video
description: >-
  Palette lets creators and marketing teams make images and video in a web
  workspace. They can bring a prompt or reference into a conversation, revise
  the output with text instructions, and arrange work into storyboards.
  Developers can also call its API, which uses the same credit balance as the
  studio.
problem: >-
  Creating a campaign across images and video often means moving references
  and editing decisions between separate tools.
audience:
  - Content creators
  - Marketing teams
