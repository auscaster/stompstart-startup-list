name: Rankhog
tagline: Finds people on Reddit asking for what you sell, and replies for you
description: >-
  Rankhog watches the subreddits where a product's buyers gather and finds
  posts from people asking for what the product sells. For each match it
  checks the rules of that subreddit, drafts a reply that helps first and
  names the product only when it fits, then posts from the founder's own
  Reddit account at a human pace, or waits for approval. A new account can
  be warmed up with helpful comments before it starts posting. The app runs
  on macOS, Windows and Linux, and through Claude, ChatGPT, Cursor and
  other MCP clients. The plan costs $99 a month per product and starts
  with a 7 day free trial.
problem: >-
  Buyers ask for recommendations on Reddit every day, but watching
  subreddits, learning each community's rules and answering in time is a
  full time job, and one careless promotional comment can get an account
  banned.
audience:
  - Solo founders and small teams
  - Marketers promoting a product on Reddit
