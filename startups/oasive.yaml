name: Oasive
tagline: Fixed-income research, screening, and valuation in one workflow
description: >-
  Oasive is a research platform for bond investors. A portfolio manager or
  analyst can ask what is moving rates, compare Treasury maturities, and
  screen agency mortgage-backed securities without hopping between market
  data, models, and slide decks. Macro and rates research and the agency
  MBS desk are live; municipals, ABS, and corporates are still on the
  roadmap. Free research needs no card. Paid seats start with a 14-day trial.
problem: >-
  Fixed-income desks still split the same question across market data,
  security data, spreadsheet models, PDF research, and presentation tools.
audience:
  - Portfolio managers and traders on fixed-income desks
  - Analysts covering rates and agency mortgage-backed securities
