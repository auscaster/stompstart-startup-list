# Voyage Labs, proposed for Stompstart. Facts from the startup's own site and launch coverage.
name: Voyage Labs
tagline: A personal AI agent that plans, books and watches over trips
description: >-
  Atlas is a personal AI agent from Voyage Labs for trips and local outings.
  A traveller describes what they have in mind in plain words, and Atlas puts
  together the plan, books flights, stays, dining and experiences through
  suppliers, and keeps watch on prices, availability and check-in times while
  the trip is under way. It runs on the web and over text, and the people
  travelling together can see the same plan and shape it. Atlas is in private
  beta, open through a waitlist.
problem: Planning a trip means juggling searches, bookings and price checks across many sites, then keeping track of every detail until the traveller is home.
audience:
  - People planning trips
  - Groups planning outings together
