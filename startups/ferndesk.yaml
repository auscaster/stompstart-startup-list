name: Ferndesk
tagline: A help center that stays current as the product changes
description: >-
  Ferndesk is a hosted help center with Fern, an agent that checks every
  article against the live product, fixes what changed, and drafts what is
  missing. Teams migrate existing docs in one click, publish on their own
  domain or /help path, and embed an in-app widget with AI conversations.
  Founders use it so documentation keeps pace with product work instead of
  going stale after launch.
problem: >-
  Product teams write help articles once, then the product moves on and the
  docs go out of date until someone notices and rewrites them by hand.
audience:
  - SaaS founders and product teams who ship help centers
  - Support leads who need docs that match the current product
