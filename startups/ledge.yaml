name: Ledge
tagline: Markdown notes that run shell commands, code, SQL and AI
description: >-
  A Markdown notebook app for developers and DevOps who keep commands in their
  notes. Write a note, press Cmd+Enter on a code block and its output streams
  in beneath it: shell in the terminal, in the project, on the machine or on
  a server. Notes can run code, SQL and AI prompts, and hold per-project
  profiles with the API keys and database URLs they use. Available as desktop
  apps for Apple Silicon Mac, Windows (x64) and Linux (x64 and arm64), with a
  mobile app for iPhone, iPad and Android. Free and open source.
problem: >-
  Runbooks and command snippets live in static notes: copying each command
  into a terminal and pasting the output back breaks the loop. A notebook that
  runs the commands in place keeps the runbook and its evidence together.
