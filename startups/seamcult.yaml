name: Seamcult
tagline: Draft sewing patterns with your AI coding agent
description: >-
  Seamcult is a web tool for designing sewing patterns with an AI coding
  agent. You give the agent a photo, a paper pattern, or a short brief, and
  it drafts the pattern on a mannequin built from your measurements while
  you watch the work on a canvas. The tool checks the geometry of the draft,
  so the agent works from the measurements rather than guessing. You can ask
  it to refit a pattern to another size, split a piece, add a pocket, or
  move a seam, and you can sketch a fix on the canvas for the agent to see
  as an image. Finished patterns print on A4 paper at home, export as PLT
  or DXF files, or share through a read-only link. It is free while in
  early access.
problem: Sewing patterns are usually drafted by hand or in tools that do not work with the AI assistants people already use, so fitting and revising a pattern takes slow manual work.
audience:
  - People who sew their own clothes
  - Pattern designers and small sewing studios
