name: Hiasynth
tagline: European market research through a synthetic population model
description: >-
  Hiasynth lets businesses ask an AI assistant questions about European consumer
  markets using Humanity, its synthetic population model. Teams can estimate
  audience sizes, compare locations and explore household characteristics through
  an MCP connection. The model links simulated individuals with households and
  neighbourhoods, drawing on official statistics and survey data. It provides
  statistical market research rather than records for identifying or contacting
  real people. A monthly subscription includes query credits.
problem: >-
  Comparing consumer audiences across European countries requires combining
  separate statistical sources and research tools.
audience:
  - Market research teams
  - Businesses evaluating European audiences and locations
