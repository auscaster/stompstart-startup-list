name: AgentBox
tagline: Isolated workspaces for running coding agents in parallel
description: >-
  AgentBox provisions separate development workspaces where multiple coding
  assistants can operate at the same time. Its command line manages setup,
  pause, resume, and teardown across local Docker hosts, remote machines, and
  supported cloud services. A companion macOS app shows active boxes and opens
  their terminals, browsers, editors, and Git branches.
problem: >-
  Concurrent coding-agent sessions can interfere with files, services, ports,
  and credentials when they share one development environment.
audience:
  - Software developers running multiple coding-agent sessions
  - Engineering teams that want repeatable, isolated development environments
website: https://agent-box.sh/
