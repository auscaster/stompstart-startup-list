name: Salem Robotics
tagline: Autonomous robot software for industrial inspections
description: >-
  Salem Robotics develops software for mobile robots that carry out surveys and
  inspections in hazardous industrial facilities. Its system brings together
  task planning, instrument handling, measurement collection and inspection
  records. Facilities can request a pilot using robots they already own or a
  platform supplied with the deployment. The company starts with nuclear
  inspection workflows and also describes applications in oil, gas and chemical
  facilities.
problem: >-
  Routine industrial surveys require skilled staff to enter hazardous areas,
  take measurements and transcribe inspection records by hand.
audience:
  - Industrial inspection and survey teams
  - Nuclear facility operators
