name: Hebbian Robotics
tagline: Data quality tools for robotics training datasets
description: >-
  Hebbian Robotics builds tools for inspecting and processing recordings used to
  train robots. Its open-source HFlow Python SDK runs transformations and quality
  checks on synchronized recordings, then records measurements and provenance in
  a queryable catalog. Teams can select training data from that catalog and
  reproduce the processing steps behind a dataset. The company also offers
  early access to models for evaluating physical AI data.
problem: Robotics teams need to detect faulty recordings and track how training datasets were assembled.
audience:
  - Robotics teams collecting demonstrations
  - Providers of robotics and egocentric training data
