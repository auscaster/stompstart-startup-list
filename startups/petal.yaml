name: Petal
tagline: Open source screen sharing for pair programming, where shared windows stay real windows
description: >-
  A free desktop app for macOS and Windows built for small engineering syncs
  of about three to eight people. When someone shares a window, it opens on
  every other participant's desktop as its own native window that they can
  move and resize, instead of a video tile in a grid. Several people can share
  at once, everyone gets a labelled cursor, and any participant can click and
  type into a shared window. Teams keep persistent rooms, so joining a sync is
  one click. Calls run on the hosted Petal Cloud by default, or on a LiveKit
  server the team runs itself, and the source is published under Apache-2.0.
  It is built by four people from the team behind CoScreen, the pairing tool
  Datadog acquired in 2022 and shut down on 31 July 2026.
problem: Pair programming in general video call tools flattens shared windows into one video tile, so only one person can share and the others cannot work in it.
audience:
  - Small software engineering teams
  - Developers who pair program remotely
  - Teams that need to self-host their meeting traffic
