name: Mass Magnetics
tagline: Recycled rare-earth materials and domestically manufactured magnets
description: >-
  Mass Magnetics recovers rare-earth material from discarded motors, hard drives
  and industrial equipment. It sorts material by grade and chemistry, supplies
  recovered magnetic alloys, and is developing US production of permanent magnets.
  Its website accepts magnet preorders and requests for material quotations.
problem: Manufacturers need additional sources of rare-earth materials and permanent magnets.
