name: Kekoso
tagline: Local speech transcription and dictation for Apple silicon Macs
description: >-
  Kekoso is a macOS utility that converts speech into text using models stored on
  the user's computer. A keyboard shortcut inserts dictated text into the active
  application. The same app can process audio and video files, transcribe calls,
  and export timed transcripts as text or subtitle files. Users can choose a
  recognition model and maintain a vocabulary for names and specialist terms.
  A local MCP server exposes transcription and related controls to compatible
  coding assistants. Speech recognition stays on the Mac; an optional translation
  feature sends recognized text to the user's chosen OpenRouter provider.
problem: Dictation, recording transcription and agent transcription often require separate tools.
audience:
  - Mac users who dictate or transcribe recordings
  - Developers connecting local speech tools to coding assistants
