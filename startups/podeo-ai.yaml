name: Podeo.ai
tagline: Convert podcast audio into editable videos for YouTube
description: >-
  Podeo.ai builds videos from podcast episodes without requiring filmed footage.
  Creators can select an episode from an RSS feed, set a visual profile and edit
  the resulting video using a timeline or conversational instructions. Exports
  include captions, chapters and thumbnails, with direct YouTube publishing and
  downloadable videos for other platforms.
problem: Audio podcast producers need a way to publish video episodes without filming each recording.
audience:
  - Independent podcasters
  - Podcast networks
  - Agencies and podcast producers
website: https://www.podeo.ai/
access:
