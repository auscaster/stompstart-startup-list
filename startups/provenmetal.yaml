name: ProvenMetal
tagline: US-based circuit board manufacturing with automated quoting
description: >- ProvenMetal is a US-based circuit board manufacturing service backed by Y Combinator. Customers send design files or specs and receive an automated quote with DFM review and a sourced bill of materials. Orders are routed through a network of fabrication and assembly partners, and assembled boards are delivered domestically in as few as five days. The company also offers an API, an MCP server, and plugins for Altium Designer and KiCad.
problem: >- Getting circuit boards built domestically is slow. More than half of the lead time goes to quoting, DFM review, and part sourcing rather than manufacturing itself.
