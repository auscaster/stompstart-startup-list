name: Volaren
tagline: Research tools for individual investors, built by former hedge fund analysts
description: >-
  Volaren gives individual investors the research workflow that professional
  analysts use. A person describes a strategy in plain English and the service
  builds and backtests it against company filings and market data, showing the
  source behind every figure. The dashboard covers stocks, ETFs, options,
  commodities, crypto, rates and currencies, and a screener filters on
  fundamentals such as free cash flow yield and debt to equity. Users can
  publish strategies to a shared marketplace and follow the ones they trust.
  A free plan resets monthly and paid tiers add more usage.
problem: >-
  The research software that values a company is priced and designed for
  professional analysts, so individual investors work from either raw data or
  unsourced opinions.
audience:
  - Individual investors
  - Small research teams
  - Active retail traders
