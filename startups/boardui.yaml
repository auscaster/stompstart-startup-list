name: BoardUI
tagline: React components and templates for agentic interfaces
description: >-
  BoardUI is a React design system for interfaces that combine AI agent workflows
  with dashboards. Its free catalog is distributed as source code that developers
  can add to their own projects, with additional paid templates available separately.
problem: Developers building agent products need interface pieces for chat, agent activity and dashboard data without assembling separate component systems.
audience:
  - Developers building AI agent products and dashboards
