name: Munito
tagline: An EU-hosted inference API for open AI models
description: >-
  Munito runs open-weight models such as GLM, Qwen and DeepSeek behind an API
  that accepts requests written for the OpenAI or Anthropic SDKs, so a team
  changes only the base URL and key. Requests sent to its EU endpoint are
  processed in the EU, it keeps no prompt data by default and does not train
  on customer data. One key also covers speech to text and document models.
  There is a free tier, and paid credits raise the limits.
problem: >-
  European companies that want open models often have to manage their own GPUs
  or send data to providers outside the EU.
audience:
  - Developers building AI products and agents
  - Companies whose customers ask where their data is processed
