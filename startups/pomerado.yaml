name: Pomerado
tagline: Turns websites without an API into tools that AI agents can call
description: >-
  Pomerado lets developers, or the coding agents they work with, describe a task
  on a website in a sentence and get back an API and MCP tool for it. The tools
  run as fixed code against the site instead of a browser agent reasoning
  through every page, and they are rebuilt when the site changes. It works on
  sites the user does not own, and the code is open source under the MIT
  licence.
problem: >-
  Airline, bank, insurance, government and older business portals rarely offer
  an API, so agents fall back on browser automation, which is slow, costly and
  often not allowed by security teams.
audience:
  - Developers building AI agents
  - Teams automating work on portals that have no API
