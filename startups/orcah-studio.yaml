name: Orcah Studio
tagline: Local video search for Apple Silicon Macs
description: >-
  A desktop application that indexes video libraries on an Apple Silicon Mac
  and retrieves moments by spoken words, visual content, sound, colour and
  camera metadata. Processing stays on the user's machine by default. Results
  can be handed to Final Cut Pro or DaVinci Resolve, while an open-source
  Docker edition provides browser access to the same search core.
problem: Large video libraries make it slow to locate a specific moment inside files.
audience:
  - Video editors and production teams with large footage libraries
