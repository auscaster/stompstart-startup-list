name: Text Agent Store
tagline: Discover AI agents that work through text messaging
description: >-
  Text Agent Store is a directory and marketplace for AI agents that people can
  use through text messaging. It groups agents by use case, lets visitors browse
  individual agent profiles, and provides a submission path for builders who
  want their messaging agents reviewed for inclusion.
problem: >-
  Text-based AI agents are scattered across separate products and social posts,
  making it difficult for people to discover useful agents or compare what each
  one is designed to do.
audience:
  - People looking for AI agents they can use through text messaging
  - Builders of messaging-based AI agents
