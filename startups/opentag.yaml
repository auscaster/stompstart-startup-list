name: OpenTag
tagline: A model-agnostic AI coworker for Slack and Teams
description: >-
  OpenTag works inside team chat so people can hand off real tasks without
  leaving the conversation. It can use connected business tools, route work to
  different AI models, return results in-thread, and maintain shared knowledge
  from the work it sees.
problem: Teams lose time moving context between chat, AI tools and business systems when work should happen where the conversation already lives.
audience:
  - Operations teams
  - Product and engineering teams
  - Small and midsize businesses using Slack
