name: Glen
tagline: Shared context for teams using coding agents
description: >-
  Glen gives teams a shared memory for coding agents and company work. It
  collects agent session histories and context from Slack, GitHub, tickets,
  calls and documents, then surfaces relevant prior work in new agent sessions.
  Teams can search past sessions and reuse skills distilled from repeated work.
problem: Agent sessions and decisions are scattered across tools, so teams repeatedly explain context and lose prior reasoning.
audience:
  - Engineering teams using coding agents
  - Organizations coordinating work across agents and company tools
