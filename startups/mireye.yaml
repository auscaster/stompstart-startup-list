name: Mireye
tagline: Location data and query tools for AI applications
description: >-
  Mireye lets developers query information about US locations through a REST API
  and an MCP server. Applications can resolve addresses, retrieve environmental
  and infrastructure data, and measure proximity to nearby facilities. Responses
  include source links and freshness information. The service offers a free
  credit allowance, paid plans and public examples for site assessment and
  property analysis.
audience:
  - Developers building applications that use location data
  - Teams assessing land, infrastructure and property
