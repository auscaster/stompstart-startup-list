name: Maritime
tagline: Managed cloud infrastructure providing an isolated persistent virtual machine for each AI agent
description: >-
  Maritime is a cloud hosting platform that gives each AI agent its own
  isolated, persistent virtual machine with disk storage that survives sleep,
  restart and redeployment. Developers can run Linux computers, Windows
  desktops or virtual Android phones for their agents, or connect an external
  backend through MCP, with three agents hosted for free and paid fleet plans
  starting at one dollar per agent per month.
problem: Teams deploying customer-facing AI agents spend significant engineering effort provisioning, maintaining and debugging separate runtime environments for every user.
audience:
  - Software teams building and selling customer-facing AI agents
  - Startups giving each user a dedicated personal assistant or AI employee
