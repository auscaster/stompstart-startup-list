name: Roma
tagline: A to-do list that starts the work on the tasks you add
description: >-
  Roma is a to-do list where an operator does the work behind each task. You
  add something in your own words, Roma turns it into a clear task, sorts it
  into a project, and starts on it in the background on its own computer. You
  come back to review what it prepared, finish it, or steer it. There are Mac
  and iPhone apps, and connections to Gmail, Google Calendar, Dropbox, Linear
  and Notion.
problem: >-
  A to-do list keeps tasks in one place but leaves all the doing to you, so
  lists grow faster than they get cleared. Assistants answer in a chat, but
  the work they help with ends up scattered across conversations instead of
  living next to the task.
audience:
  - People who keep a personal task list
  - Teams that coordinate work across email and documents
