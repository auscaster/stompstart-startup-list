name: Touchy
tagline: A voice and camera assistant for iPhone
description: >-
  Touchy is an iPhone assistant that takes spoken requests and can use
  the camera to understand what a user is looking at. Users can connect
  services such as calendars and messaging apps so the assistant can
  carry out actions with permission. It keeps a continuous conversation
  and remembers preferences to provide context for later requests.
problem: Phone users have to switch between separate apps to complete small tasks and ask about their surroundings.
audience:
  - iPhone users
  - People managing tasks across connected apps
