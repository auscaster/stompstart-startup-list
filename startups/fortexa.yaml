name: Fortexa
tagline: Stellar blockchain network with smart contract platform and dApp ecosystem
description: >-
  Fortexa is a Stellar-based blockchain network that ships a smart contract
  platform, on-chain governance, and a dApp ecosystem anchored on the
  existing Stellar rails. Contracts written for Soroban can run on Fortexa
  with the same account model and asset primitives, so dApps move between
  networks without rewriting their state model.
problem: >-
  Smart contract networks that ignore Stellar account and asset model force
  developers to port every primitive. Fortexa runs on the same model so dApps
  move between Stellar mainnet and Fortexa without rewriting their state.
audience:
  - Soroban dApp developers
  - On-chain analysts
  - Stellar ecosystem operators
