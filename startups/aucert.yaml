name: Aucert
tagline: AI agents that check every mobile app build before release
description: >-
  Aucert runs a set of AI agents against a mobile app build. The agents map
  the app's screens and flows, turn the team's expectations into checks, and
  report a verdict with evidence for each build. Separate agents cover design,
  accessibility, functional validation, build health and the Google Play and
  Apple App Store review rules. It supports Android, iOS, Kotlin Multiplatform
  and React Native apps, and teams can request a free scan of a published app.
problem: Mobile teams check each release by hand, and store rejections and regressions slip through.
audience:
  - Mobile engineering teams
  - QA and release managers
