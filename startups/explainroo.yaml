name: explainroo
tagline: Local tools for narrated videos made with coding agents
description: >-
  explainroo is an open-source video toolkit for coding agents. An agent prepares
  a script and JavaScript scenes, then the toolkit combines a local voice,
  word-level timing and canvas animation into a narrated MP4. It includes
  documentation and examples of explainers and product demonstrations.
problem: Making a narrated explanation requires coordinating a script, visuals and timing.
audience:
  - Developers using coding agents
  - Creators making explainer videos
  - Small teams preparing product demonstrations
website: https://www.explainroo.com/
