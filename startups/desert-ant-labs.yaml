name: Desert Ant Labs
tagline: Small AI models and SDKs for audio, text and vision on the device
description: >-
  Desert Ant Labs develops task-specific AI models that run inside apps on phones,
  computers and browsers. Its catalog includes speech transcription, audio cleanup,
  personal-data redaction, language identification and video clip selection. Developers
  integrate the models through Swift, Kotlin or JavaScript SDKs, and the company publishes model weights
  on Hugging Face. Inference processes the app's content locally instead
  of sending it to a hosted model API. Each model is free below 100,000 monthly active
  devices per platform; larger deployments require a commercial license. The software
  is source-available, with attribution and other license conditions.
problem: >-
  Repeated cloud inference calls add latency and usage costs to app features such as
  transcription, audio processing and text classification.
audience:
  - Developers building mobile, desktop and browser applications
  - Product teams adding local audio, text or vision features
