name: Pexo
tagline: Create and revise finished videos through conversation
description: >-
  An AI video production tool that turns prompts, links, images, audio and other
  supplied assets into edited videos. Pexo can plan scenes, generate media, add
  voiceover, music and captions, and lets users request revisions by commenting
  on frames instead of working in a traditional timeline.
