name: Capsule
tagline: Single-file apps that carry their own SQLite data
description: >-
  Capsule is a player for one kind of document: a .capsule file that holds a small
  HTML application, its assets and a SQLite database in a single bundle. A tool built
  this way can be sent like a document, opened without a connection and kept without a
  server or an account. A document starts from a starter template, from pasted HTML, or
  from the builder prompt the site hands to an AI assistant. Documents run isolated:
  they get no file system access, and they need permission before they may use the
  network. Data can be exported to CSV or JSON. The desktop player, written in Rust with
  Tauri, ships for macOS, Windows and Linux, and Capsule Web opens the same files in a
  browser.
problem: A small personal tool needs a server, a bill and an account before it can save a single row of data.
audience:
  - People who want a private tool without hosting it
  - Teams that pass a small internal tool around as a file
  - Developers building single-file apps with AI assistants
highlights:
  - title: One file holds the app and its data
    detail: >-
      The interface, the media assets and a SQLite database travel together as one
      .capsule document that opens in the desktop player or in the browser player.
  - title: Nothing runs without permission
    detail: >-
      A document cannot touch the file system, and it asks before it reaches the
      network, so an opened file stays a document rather than a program with your keys.
