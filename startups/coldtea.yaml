name: Coldtea
tagline: An agentic IDE for teams that ship software with AI coding agents
description: >-
  Coldtea is an IDE built for software teams that build with AI coding agents.
  Coding agents write and change the code inside the editor, visual QA agents
  review each change for regressions, and monitoring keeps watch once the code
  reaches production. It launched publicly on Product Hunt on August 7, 2026.
problem: As AI coding agents write more of a team's code, keeping production stable gets harder.
audience:
  - Software teams building with AI coding agents
