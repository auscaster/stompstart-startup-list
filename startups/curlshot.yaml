highlights:
  - title: One request per screenshot
    detail: "GET /api/v1/screenshot?url=... returns an image or PDF; failed renders and cache hits are not counted."
  - title: Free plan
    detail: 100 screenshots a month with no card; paid plans start at $19 a month with a fixed monthly quota.
  - title: Built for agents
    detail: A hosted MCP server, an OpenAPI 3.1 description and llms.txt.
