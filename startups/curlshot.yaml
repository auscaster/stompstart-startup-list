name: CurlShot
tagline: A screenshot API for web pages, HTML and Markdown
description: >-
  CurlShot turns a web address, raw HTML or Markdown into a PNG, JPEG, WebP or
  PDF with one HTTP request, or records the page scrolling as a video. It
  covers full-page and element captures, phone and tablet views, dark mode and
  bulk jobs, and hides ads and cookie banners before the capture. An MCP
  endpoint lets AI agents take screenshots, and a free tool on the home page
  works without an account.
problem: Running and maintaining headless browsers just to capture web pages takes time away from the product.
audience:
  - Software developers
  - No-code and AI agent builders
website: https://curlshot.com/
