# EventSend — proposed startup for the Stompstart startup list.
name: EventSend
tagline: Event tracking and routing for product teams
description: >-
  EventSend is a single HTTP endpoint an app posts events to. It records each
  event in a searchable feed, then delivers it to where the team already works:
  Slack, Discord, Telegram, push or a webhook. A payload such as
  {"event": "payment.failed", "message": "..."} is all it takes; the service
  handles validation, deduplication and retries against destinations that
  misbehave. Sources flip the flow around: a signed webhook URL pasted into
  Stripe, GitHub or Vercel turns their notifications into the same feed without
  any code. The product also ships an MCP server and copy-ready prompts, so an
  agent can instrument the moments worth knowing about and then answer
  questions about them.
problem: >-
  Small teams learn about failed payments, deploys and signups from customers or
  dashboards instead of their own system, and building reliable fan-out with
  retries is infrastructure they would rather not maintain.
