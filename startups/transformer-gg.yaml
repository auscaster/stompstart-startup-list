name: Transformer.gg
tagline: Book sponsored posts from X creators, from a dashboard or your AI agent
description: >-
  Transformer.gg is a marketplace for sponsored posts on X. A brand pastes its
  website and gets a list of X creators who fit what it sells, each with a
  suggested price. Sending offers is free with no subscription, seat fee or
  minimum. When a creator accepts, the brand's saved card is charged and the
  money is held until the post is live with X's Paid partnership label and our
  team confirms it. Creators keep 80% and are paid by PayPal or USDC. Every
  offer comes with a tracked link so clicks and sales are credited to the
  creator who drove them. Brands can run everything from the web dashboard or
  hand it to Claude, Codex or their own agent through our MCP server, CLI or
  REST API. Creators can check the value of one sponsored post on any X account
  for free with no sign-up. Transformer.gg is part of North Bay Ventures (North
  Bay Opco I, Inc., Miami, Florida). The founder is Jon Oringer, who founded
  Shutterstock.
problem: >-
  Brands and AI agents have no fast, self-serve way to discover relevant X
  creators, see transparent per-post pricing, and book paid sponsored posts
  with tracked attribution without manual outreach and negotiation.
audience:
  - Brands and growth teams running creator campaigns on X
  - Developers and AI agents automating creator sponsorships via MCP or API
  - X creators monetizing sponsored posts
