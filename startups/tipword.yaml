name: Tipword
tagline: Instant word translation anywhere on your Mac
description: >-
  Tipword is a macOS translation utility that shows the meaning of a word beside
  the pointer when you hold a chosen modifier key. It works across apps,
  websites, PDFs, subtitles, photos and screenshots, with on-device translation
  for supported languages and optional Google translation for additional ones.
problem: Looking up an unfamiliar word usually interrupts reading by sending the user to a separate translator.
