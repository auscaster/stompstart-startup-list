name: TryNearby
tagline: Word-of-mouth marketing on autopilot for restaurants
description: >-
  TryNearby connects local restaurants with a managed group of nearby creators.
  Each month a restaurant gets five local creators who visit, eat and post about
  the spot, with a fully managed creator flow, an analytics dashboard and
  dedicated account support. Creators get sent new places to visit every week,
  show up, eat and post, while TryNearby handles the rest.
problem: >-
  Local restaurants struggle to be discovered. Creator marketing is built around
  reaching people everywhere, but local businesses need creators who live nearby
  and post about places their viewers can actually walk into.
audience:
  - Local restaurants
  - Local creators
