name: Taskhold
tagline: A task list you share with your coding agents
description: >-
  Taskhold is one task list shared by a person and their coding agents. The
  person adds and orders tasks in a web app and watches a live board while the
  agent works. The agent reads and updates the same list through a remote MCP
  server, plans steps, reports progress, and blocks a task with a question when
  it needs a decision. Claude Code, Cursor, Codex, ChatGPT and any MCP client
  can connect.
problem: Coding agents lose track of what is queued, what is half done and what needs a human answer between sessions.
audience:
  - Developers who work with coding agents
  - Small product teams
