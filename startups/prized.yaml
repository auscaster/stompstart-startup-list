name: Prized
tagline: Cloud development boxes for software teams
description: >-
  Prized gives developers persistent Linux machines through a browser or CLI.
  Project files sync between the laptop and the remote box, while forwarded
  ports open locally. Sessions and agents can continue running after the laptop
  disconnects. Teams can also create temporary sandboxes through an API.
problem: Development sessions and agents need somewhere to keep running when a developer closes a laptop.
audience:
  - Software developers
  - Teams running coding agents
