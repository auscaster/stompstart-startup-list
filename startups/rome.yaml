name: Rome
tagline: An open-source agentic OS for persistent apps and reusable workflows
description: >-
  Rome is an open-source agentic operating system that lets AI agents build
  tools, retain context across sessions, and reuse capabilities across tasks.
  It treats agents as first-class processes with their own lifecycle, memory,
  and tool registry, so an agent that learned a workflow yesterday can apply
  it today without re-reading the docs.
problem: >-
  AI agents lose context between sessions and cannot reuse work. Every task
  starts from scratch, re-reading docs and re-discovering APIs. Rome gives
  agents persistent state and a tool registry so capabilities compound.
audience:
  - AI agent operators
  - Developer tools teams
  - Open source contributors
