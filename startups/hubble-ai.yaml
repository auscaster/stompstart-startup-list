name: Hubble
tagline: Patient-authorized medical records through one API
description: >-
  Hubble gathers medical records for software teams after a patient authorizes
  access. It connects to electronic health record systems and health information
  exchanges, and uses browser and voice agents for providers outside those
  integrations. Retrieved documents are organized into structured data with
  references to their original sources. Teams can request a demonstration
  through the website before integrating the service.
