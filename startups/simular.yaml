name: Simular
tagline: Autonomous computer-use agent and robosecretary
description: >-
  Simular builds research-driven autonomous AI agents that operate real
  computers. Its primary agent, Sai, acts as a robosecretary that automates
  repetitive desktop workflows, navigating across operating systems, desktop
  apps, file systems, and browsers just like a human operator.
