name: Hoplite
tagline: Cloud workspaces for coding agents and software teams
description: >-
  Hoplite hosts coding agents in isolated cloud workspaces connected to GitHub
  repositories. Teams can bring their existing sessions, MCP connections and
  command-line tools into those workspaces, then inspect previews and recordings
  of the resulting changes. It offers a web interface and a Mac application,
  alongside integrations for Slack and Linear. Its free plan requires a card.
problem: Running several coding agents locally requires developers to manage compute, environments and feature previews.
audience:
  - Software developers
  - Engineering teams
