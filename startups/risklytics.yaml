# Startup submission for the Stompstart startup list.
name: Risklytics
tagline: Commercial insurance brokerage for robotics and physical AI companies
description: >-
  Risklytics is an insurance brokerage for companies that build and deploy AI in
  the physical world. It helps robotics, drone, hardware and autonomous vehicle
  teams place commercial coverage such as general liability, technology errors
  and omissions, cyber, property and umbrella policies. The company is backed by
  Y Combinator and works from San Francisco.
problem: >-
  Frontier technology companies often find that standard commercial insurance
  does not match what they build or how they operate, and brokers used to
  software or to traditional manufacturing may not recognise the risks.
audience:
  - Robotics companies
  - Hardware and deep tech startups
  - Drone and autonomous vehicle operators
  - AI software and agent companies
