name: Dreamscale Labs
tagline: Cloud inference for robot AI models
description: >-
  Dreamscale Labs runs robotics models on cloud GPUs so teams can connect
  their robots without hosting large models on local hardware. Its platform
  combines model, GPU kernel and network optimization, with on-demand
  compute for testing and deployment. Teams can use supported models or
  bring their own checkpoints.
problem: Large robotics models require compute that can be difficult to fit on a robot.
audience:
  - Robotics engineering teams
  - Robotics research labs
