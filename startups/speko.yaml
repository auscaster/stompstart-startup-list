name: Speko
tagline: Compare and route the models behind a voice agent
description: >-
  Speko gives teams building voice agents an API for choosing and routing speech
  recognition, language and speech synthesis models. Developers can select for
  language, latency, accuracy or cost, and inspect the published benchmarks
  behind those choices. The hosted service handles provider routing and billing;
  an open-source gateway also supports using a team's own provider keys.
problem: >-
  Replacing one part of a voice agent often means repeating model evaluations
  and maintaining another provider integration.
audience:
  - Developers building voice agents
  - Teams maintaining multilingual voice applications
