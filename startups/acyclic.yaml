name: Acyclic
tagline: Rapid agent swarms that finish long agentic workflows faster
description: >-
  Acyclic runs a task as a swarm of coding agents. It splits the work across
  agents that each work in an isolated sandbox, then merges their results into
  one patch or pull request. Users start a swarm from a command line tool, a web
  dashboard, or a coding agent over MCP, and bring their own model keys. The
  company was founded by two University of Cambridge graduates and is funded by
  Y Combinator.
problem: Long agentic tasks run one step at a time, so they take hours to finish.
audience:
  - Software engineers
  - Teams running coding agents at scale
