name: TypeSafe AI
tagline: Decision models for automation inside software
description: >-
  TypeSafe AI builds models that return typed probabilistic decisions for software.
  Its first public model, Jev, takes unstructured state and predefined questions and
  returns structured choices, scores, or yes/no decisions with confidence values.
problem: Software teams need fast automated judgments that applications can consume without parsing free-form model output.
