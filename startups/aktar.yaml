name: Aktar
tagline: Upload to your own S3-compatible storage and copy a share link from the Mac menu bar
description: >-
  Aktar is a macOS menu bar app that uploads files to storage you already
  control, such as Amazon S3, Cloudflare R2, Backblaze B2, DigitalOcean Spaces
  or MinIO. Drag a file onto the menu bar icon, paste from the clipboard, or
  pick a file, and Aktar puts a public link on the clipboard as a plain URL,
  Markdown, HTML or a custom template. It keeps upload history with previews,
  can browse and manage bucket folders, supports expiring uploads through the
  bucket lifecycle rules, and stores credentials in the macOS Keychain with no
  Aktar account or telemetry.
problem: >-
  Sharing a file from your own cloud usually means opening a console, setting
  an object public, and copying a URL by hand, so people fall back to third-party
  file hosts that keep a copy of the file.
audience:
  - Mac users who already keep files in S3-compatible buckets
  - Developers and freelancers who want share links without a hosted file service
