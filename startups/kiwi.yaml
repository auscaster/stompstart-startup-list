name: Kiwi
tagline: A runtime for building GTM agents that run on checked company data
description: >-
  Kiwi is a runtime where a revenue team describes a workflow and Kiwi drafts the
  agents behind it. Those agents read from one versioned record of the team's GTM
  data, synced from tools such as Salesforce, HubSpot, Gmail, Slack and Gong, so
  each answer points to the rows behind it. Anything that leaves the company stops
  for a named person's approval first, and any run can be replayed against the
  exact data it saw.
problem: >-
  Revenue agents fail quietly when the data behind them is stale or partial, and a
  wrong answer sent to a customer is expensive to correct.
audience:
  - Revenue operations teams
  - Sales and account management teams
