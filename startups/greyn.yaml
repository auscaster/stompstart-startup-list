name: Greyn
tagline: A marketplace for surplus construction stock in Belgium
description: >-
  Greyn connects businesses holding leftover building supplies with buyers
  looking for nearby materials. Sellers can photograph their stock to draft
  listings with AI, then check the details before publication. Buyers browse
  local offers by material type and availability. Businesses can also bring
  existing inventory into the platform from Excel or PDF files.
problem: Usable stock remains idle when construction businesses cannot find local buyers.
audience:
  - Construction firms
  - Building-material merchants
  - Businesses sourcing reusable supplies
