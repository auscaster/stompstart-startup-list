name: eustella
tagline: Europe's personal AI agent for smartphones
description: >-
  eustella is a personal AI assistant built for smartphones and the web. It
  runs on open-weight models and keeps user data inside the European Union.
  A large set of prebuilt agent templates cover everyday tasks, from planning
  meals and trips to budgeting and learning. The project positions itself as
  a data-sovereign alternative to US-hosted assistants, with European cloud
  infrastructure and a free tier alongside paid plans.
problem: People in Europe want an AI assistant that keeps their data within EU
  data-protection rules instead of sending it to US-hosted services.
audience:
  - Smartphone users in Europe
  - Privacy-conscious individuals
  - Small teams and solo professionals
