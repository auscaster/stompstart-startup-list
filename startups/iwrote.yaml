name: iwrote
tagline: Write the way you always do, and certify that you wrote it.
description: >-
  iwrote is a browser writing app that records the craft behind a finished piece. As
  you type, it logs the edits: what you wrote, when you paused to think, what you cut,
  and what you pasted in. When the draft is done you certify it and get a short link
  that shows readers the effort behind it, a timeline drawing of the session that no
  one can alter. The service keeps counts and timings, never the words themselves, and
  it treats a writing aid such as research, grammar help or an AI brainstorming partner
  as a tool, not a ghostwriter.
problem: AI writing detectors are unreliable and often wrong, so a genuine author has
  no credible way to prove a piece is their own. iwrote replaces the guesswork with a
  tamper-evident record of the writing session itself.
audience:
  - Writers and journalists who publish under their own name
  - People who want to show a piece is human-written
  - Readers who want to check a claim without asking the author
