name: CreditUnions
tagline: Which credit union can you join? Compare eligibility.
description: >-
  CreditUnions is a directory of federally insured US credit unions built
  from the NCUA quarterly call report data. A listing shows the charter
  number, charter type, field of membership, total assets, member count
  and branch locations as filed by the credit union under US Government
  public-domain data. Visitors can browse by city and state, filter by
  who can join, or read the same records through a free REST API and an
  MCP endpoint that need no key.
problem: Finding which credit unions a person can join means checking each credit union's field of membership by hand.
audience:
  - People in the United States comparing credit unions
  - Researchers reading NCUA credit union data
