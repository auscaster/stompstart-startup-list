# Copy with `npm run new -- your-startup-slug`, then replace every sample value.
# The file holds the startup's facts; Stompstart adds identifiers and evidence at review.
name: Layout
tagline: Order food from any restaurant using AI
description: >-
  Layout connects AI assistants (Claude, ChatGPT and others) to real food
  ordering endpoints so a user can ask an LLM to place an order end to end.
  The assistant picks a restaurant, builds the cart and confirms checkout
  through a connector, while the user reviews and approves each step.
problem: Ordering food through delivery apps means opening another app, scrolling
  menus, and re-entering the same address and payment details every time.
audience:
  - People who already use ChatGPT or Claude for everyday tasks
  - Remote workers ordering lunch at their desk
website: https://layout.link/
access:
  - kind: waitlist
    url: https://account.layout.link/waitlist
categories:
  - ai-and-agents
  - commerce
stage: prelaunch
pricing:
  model: unknown
company:
  name: Layout
  relationship: independent
location:
  country: US
founded:
  precision: month
  value: "2026-09"
platforms:
  - web
