name: Rhun
tagline: A small, fast code editor written in assembly
description: >-
  An open-source code editor for Windows, Linux and macOS, written in x86
  assembly to stay light and fast. Rhun ships tabs, syntax highlighting, fuzzy
  search and optional Vim mode, runs builds, shell commands and coding agents
  beside the code, and lets users follow Claude Code and Codex sessions as they
  work. AI is optional: drafts can use local open-weight models or existing
  subscriptions, and 39 light and dark themes are included.
